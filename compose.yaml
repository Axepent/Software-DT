services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-data:/mosquitto/data
  influxdb:
    image: influxdb:2.7
    ports:
      - "127.0.0.1:8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: student
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD:-lab3-local-password}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN:-lab3-local-token-change-me}
      DOCKER_INFLUXDB_INIT_ORG: dt-lab
      DOCKER_INFLUXDB_INIT_BUCKET: mannequin
      DOCKER_INFLUXDB_INIT_RETENTION: 168h
    volumes:
      - influx-data:/var/lib/influxdb2
      - influx-config:/etc/influxdb2
volumes:
  mqtt-data:
  influx-data:
  influx-config:
